# Publishes a GitHub release: romm-deck.zip, with release notes taken from that version's section of CHANGELOG.md.
# (.gitea/workflows/release.yml does the same on Gitea; both use the scripts in scripts/.)
#
# Two ways to start it:
#   - Actions tab → Release → Run workflow, and enter the version (0.5.1-beta). This also creates the tag
#     (v0.5.1-beta) on the branch you run it from.
#   - Push a version tag:  git tag v0.5.1-beta && git push origin v0.5.1-beta. A tag pushed here by Gitea's push
#     mirror (after a release on Gitea) starts it too, so each release appears on both.
# It refuses to publish unless package.json, the backend and CHANGELOG.md are at that version and every test
# passes, so a release always matches the code in it. A version with a suffix (-beta) is a pre-release.
name: Release

on:
  push:
    tags: ["v*.*.*", "V*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (for example 0.5.1-beta)"
        required: true

permissions:
  contents: write # to create the tag and the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Decky runs the backend on its own bundled Python, which is older than the newest releases, so the
      # tests run on the oldest version the backend supports.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Work out the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v${INPUT_VERSION#[vV]}"  # (a "v" typed by mistake is fine)
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check the version and take the release notes from CHANGELOG.md
        id: notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: python3 scripts/release_notes.py "$TAG" "$GITHUB_REPOSITORY" notes.md >> "$GITHUB_OUTPUT"

      - name: Install the build tool (esbuild)
        run: npm install --no-audit --no-fund

      - name: Run every test
        run: npm test

      # package.sh also checks the zip the way Decky reads it (check_package.py), so the build stops here
      # rather than publishing a zip that Decky's "Install plugin from URL" can't install. The asset keeps
      # the same name in every release: .../releases/latest/download/romm-deck.zip relies on it.
      - name: Build romm-deck.zip, and check Decky can install it
        run: npm run package

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          TITLE: ${{ steps.notes.outputs.title }}
          PRERELEASE: ${{ steps.notes.outputs.prerelease }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            # A release made by hand on GitHub: add the zip and notes to it.
            gh release upload "$TAG" romm-deck.zip --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file notes.md --prerelease="$PRERELEASE"
          else
            flags=()
            if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
            gh release create "$TAG" romm-deck.zip --title "$TITLE" --notes-file notes.md \
              --target "$GITHUB_SHA" "${flags[@]}"
          fi
