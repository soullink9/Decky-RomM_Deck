# Publishes a GitHub release when a version tag is pushed (or created on GitHub), for example v0.5.1-beta.
#
# It checks the tag matches the plugin's version, runs every test, builds romm-deck.zip and publishes the
# release with that zip and the version's CHANGELOG.md section as its notes. If any step fails, nothing is
# published. See CONTRIBUTING.md, "Releasing".
name: Release

on:
  push:
    tags:
      - "v*"
      - "V*"

permissions:
  contents: write  # to create the release and upload the zip

jobs:
  release:
    name: Test, build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Decky runs the backend on its own bundled Python, which is older than the newest releases, so the
      # tests run on the oldest version the backend supports.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Check the version and write the release notes
        id: notes
        run: python3 .github/scripts/release_notes.py "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" release-notes.md >> "$GITHUB_OUTPUT"

      - name: Install the build tool (esbuild)
        run: npm install --no-audit --no-fund

      - name: Run every test
        run: npm test

      - name: Build romm-deck.zip
        run: npm run package

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.notes.outputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          version="${GITHUB_REF_NAME#[vV]}"
          gh release create "$GITHUB_REF_NAME" romm-deck.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "V${version//-/ }" \
            --notes-file release-notes.md \
            "${flags[@]}"
