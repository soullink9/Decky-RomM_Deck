# Publishes a release on Gitea: romm-deck.zip, with notes from that version's section of CHANGELOG.md.
#
# Two ways to start it:
#   - Actions tab → Release → Run workflow, and enter the version (0.5.2). This also creates the tag (v0.5.2) on
#     the commit it releases.
#   - Push a version tag:  git tag v0.5.2 && git push origin v0.5.2
# It refuses to publish unless package.json, the backend and CHANGELOG.md are at that version and every test
# passes, so a release always matches the code in it. A version with a suffix (-beta) is a pre-release.
#
# With Gitea push-mirroring to GitHub, the new tag reaches GitHub too, and GitHub's own release workflow
# (.github/workflows/release.yml) publishes the same release there.
#
# Like test.yml it uses no actions, so it works when GitHub can't be reached. The release notes still point at
# the public copy on GitHub (PUBLIC_REPOSITORY), which is where people install from.
name: Release

on:
  push:
    tags: ["v*.*.*", "V*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (for example 0.5.2)"
        required: true

env:
  PUBLIC_REPOSITORY: soullink9/Decky-RomM_Deck
  # who the Decky store's commits are by (the store branch): the repository's owner
  STORE_AUTHOR_NAME: Soullink
  STORE_AUTHOR_EMAIL: 344372660+soullink9@users.noreply.github.com
  # Gitea's address as the job containers can reach it, if that isn't its public address (ROOT_URL): for a runner
  # next to Gitea, e.g. http://gitea-server:3000. Set it once as an Actions variable on your user or organisation.
  GITEA_INTERNAL_URL: ${{ vars.GITEA_INTERNAL_URL }}

jobs:
  backend-tests:
    # Decky runs the backend on Python 3.10; the release job's image has a newer Python
    runs-on: ubuntu-latest
    container:
      image: python:3.10-bookworm
    steps:
      - name: Get the code
        env:
          TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          git init -q .
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          repo="${GITEA_INTERNAL_URL:-$GITHUB_SERVER_URL}/$GITHUB_REPOSITORY.git"
          git -c http.extraHeader="Authorization: Basic $auth" fetch -q --depth 1 "$repo" "$GITHUB_SHA" ||
            git -c http.extraHeader="Authorization: Basic $auth" fetch -q --depth 1 "$repo" "$GITHUB_REF"
          git checkout -q FETCH_HEAD

      - name: Backend tests on Python 3.10
        run: python3 tests/test_plugin.py && python3 tests/test_motion.py && python3 tests/test_release.py

  release:
    needs: backend-tests
    runs-on: ubuntu-latest
    container:
      image: node:22-bookworm
    steps:
      - name: Get the code
        env:
          TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          git init -q .
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          repo="${GITEA_INTERNAL_URL:-$GITHUB_SERVER_URL}/$GITHUB_REPOSITORY.git"
          git -c http.extraHeader="Authorization: Basic $auth" fetch -q --depth 1 "$repo" "$GITHUB_SHA" ||
            git -c http.extraHeader="Authorization: Basic $auth" fetch -q --depth 1 "$repo" "$GITHUB_REF"
          git checkout -q FETCH_HEAD

      - name: Work out the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v${INPUT_VERSION#[vV]}"  # (a "v" typed by mistake is fine)
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check the version and take the release notes from CHANGELOG.md
        id: notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: python3 scripts/release_notes.py "$TAG" "$PUBLIC_REPOSITORY" notes.md >> "$GITHUB_OUTPUT"

      - name: Install the build tool (esbuild, from npm)
        run: npm install --no-audit --no-fund

      - name: Run every test
        run: npm test

      - name: Build romm-deck.zip, and check Decky can install it
        run: npm run package

      - name: Publish on Gitea
        env:
          # the job's own token; set a RELEASE_TOKEN secret instead if your Gitea doesn't let it make releases
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITEA_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          COMMIT: ${{ steps.version.outputs.commit }}
          TITLE: ${{ steps.notes.outputs.title }}
          PRERELEASE: ${{ steps.notes.outputs.prerelease }}
        run: python3 scripts/publish_gitea_release.py "$TAG" "$COMMIT" "$TITLE" notes.md "$PRERELEASE" romm-deck.zip

      # The Decky store: the `store` branch holds plugins.json and plugins/versions.json (scripts/decky_store.py),
      # which a Decky with this Gitea as its custom store reads. Addresses in it are Gitea's public one, the one
      # the handheld uses. Commits there are made as the repository's owner, like every other commit.
      - name: Add the release to the Decky store (store branch)
        env:
          TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITEA_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          repo="${GITEA_INTERNAL_URL:-$GITHUB_SERVER_URL}/$GITHUB_REPOSITORY.git"
          public="${GITHUB_SERVER_URL%/}/$GITHUB_REPOSITORY"
          git init -q store
          # the store so far (none yet before the first release)
          git -C store -c http.extraHeader="Authorization: Basic $auth" fetch -q --depth 1 "$repo" store &&
            git -C store checkout -q FETCH_HEAD || echo "No store branch yet: starting one"
          python3 scripts/decky_store.py store "${TAG#[vV]}" romm-deck.zip \
            "$public/releases/download/$TAG/romm-deck.zip" "$public/raw/tag/$TAG/assets/brand/icon@2x.png"
          git -C store add -A
          git -C store -c user.name="$STORE_AUTHOR_NAME" -c user.email="$STORE_AUTHOR_EMAIL" \
            commit -q -m "chore(store): add RomM Deck $TAG"
          git -C store -c http.extraHeader="Authorization: Basic $auth" push -q "$repo" HEAD:refs/heads/store
