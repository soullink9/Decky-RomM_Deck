# Keeps the Decky store on the `store` branch up to date, every hour (or from Actions → Decky store → Run workflow):
#   - the official Decky store's listing, so a Decky using this store still lists and updates every official plugin
#     (when the official store can't be reached, the copy from last time is kept);
#   - each RomM Deck release, once the push mirror and GitHub's workflow have published it on GitHub (usually
#     minutes after the Gitea release), with its GitHub download link. Every address in the store is GitHub's:
#     the push mirror copies the store branch to GitHub too, so it never names Gitea or its domain.
# Each release adds itself (release.yml). A refresh with nothing new commits nothing.
#
# Uses no actions, like the other workflows, so it runs when GitHub can't be reached.
name: Decky store

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

env:
  PUBLIC_REPOSITORY: soullink9/Decky-RomM_Deck  # the GitHub copy, where the handheld downloads releases
  LOCAL_GITEA_URL: ${{ vars.LOCAL_GITEA_URL }}
  STORE_AUTHOR_NAME: Soullink
  STORE_AUTHOR_EMAIL: 344372660+soullink9@users.noreply.github.com

jobs:
  refresh:
    runs-on: ubuntu-latest
    container:
      image: python:3.10-trixie
    steps:
      - name: Get the code
        env:
          TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          git init -q .
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          repo="${LOCAL_GITEA_URL:-$GITHUB_SERVER_URL}/$GITHUB_REPOSITORY.git"
          git -c http.extraHeader="Authorization: Basic $auth" fetch -q --depth 1 "$repo" "$GITHUB_SHA" ||
            git -c http.extraHeader="Authorization: Basic $auth" fetch -q --depth 1 "$repo" "$GITHUB_REF"
          git checkout -q FETCH_HEAD

      - name: Refresh the Decky store (store branch)
        env:
          TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITEA_TOKEN }}
        run: sh scripts/update_decky_store.sh
